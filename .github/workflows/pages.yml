name: Deploy MechWatch to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # only to clear a stale site bundle when a run is re-run (see below)

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html css js vendor .nojekyll _site/
      # Re-running a run uploads the site bundle again under the same name, and the deploy step
      # refuses to choose between two. Remove the bundle left by the earlier attempt first.
      - name: Clear the site bundle from an earlier attempt
        if: github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
            xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deploying in its own job gives GitHub time to list the uploaded site before it is asked for.
  # In a single job the deploy step can run a fraction of a second after the upload and find nothing.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
